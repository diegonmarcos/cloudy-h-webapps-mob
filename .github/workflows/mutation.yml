# Mutation runs (#1320): each applies ONE deliberate break to a fresh checkout and runs the test that must catch it.
# A RED run is the expected result (the guard works); a green run means the guard is blind. Manual only.
name: mutation
on:
  workflow_dispatch:
    inputs:
      name:
        description: 'island-width | trailing-slash | plan-island | page-route | calc-keypad | portal-flag | client-order | c3-route | old-url | baseline-bar | finterm-drift | finterm-order | finterm-csv | finterm-url | finterm-tab | finterm-placeholder | finterm-fred | finterm-model-merge | finterm-v1-first | finterm-window | finterm-cors-model | finterm-alert-side | finterm-declared | finterm-beat | finterm-sign | finterm-cadence | finterm-sort | finterm-trim | dropdown-cap | dropdown-css | scroll-gesture | dead-export | dead-module | finterm-coverage | finterm-shortname | finterm-curve | navui-rows | finterm-table-blocked | fxm-rppp | fxm-dxy | fxm-diff | fxm-cors | g20-ma | g20-ann | g20-net | g20-real'
        required: true
permissions:
  contents: read
jobs:
  mutate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Apply mutation ${{ inputs.name }}
        run: |
          case "${{ inputs.name }}" in
            trailing-slash) sed -i "/export const trailingSlash/d" sites/cloudy-webapps/src/routes/+layout.ts ;;
            plan-island)    sed -i 's/const roomy = Math.max(classic, maxWidth - t.fitSideMargin \* 2);/const roomy = classic;/' packages/cloudy-ui/src/shell/planIsland.ts ;;
            page-route)     sed -i "s/if (parts\[2\] \&\& !page) return null;/if (parts[2] \&\& (!page || parts[2] === 'graph')) return null;/" sites/cloudy-webapps/src/lib/server/nav.ts ;;
            calc-keypad)    sed -i 's/case .\*.: return a \* b;/case "*": return a + b;/' sites/cloudy-webapps/src/apps/cloud-calc/engine.ts ;;
            portal-flag)    node -e 'const f="packages/cloudy-ui/nav/nav-overlay.json",fs=require("fs"),j=JSON.parse(fs.readFileSync(f));j.portals["cloud-chat"].embeddable=true;fs.writeFileSync(f,JSON.stringify(j,null,2)+"\n")'; node scripts/probe-portals.mjs; exit $? ;;
            client-order)   sed -i 's/get(fetcher, MESH_BASE + path)/get(fetcher, PUBLIC_BASE + path)/' packages/c3-data/client.ts ;;
            c3-route)       sed -i "s/const page = PORTAL.find((p) => p.id === id);/const page = PORTAL.find((p) => p.id === id \&\& p.id !== 'gallery');/" sites/cloudy-c3/src/lib/server/c3.ts ;;
            old-url)        sed -i "/'cloud-media': /d" scripts/lib/old-paths.mjs ;;
            baseline-bar)   sed -i 's/background: linear-gradient(180deg, var(--f-top), var(--f-bottom));/background: #d00;/' packages/cloudy-ui/src/fleet/FleetShell.svelte ;;
            finterm-drift)  sed -i "s/readFileSync(p, 'utf8') !== text) stale.push(rel)/readFileSync(p, 'utf8') !== text \&\& false) stale.push(rel)/" scripts/lib/android-src.mjs ;;
            finterm-order)  sed -i "s/^  if (route) {$/  if (false) {/;s/    if (route) {/    if (false) {/" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-csv)    sed -i "s/\['observation_date', 'date'\].includes(head\[0\].toLowerCase())/true/" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-url)    sed -i "2i const FRED_URL = 'https://fred.stlouisfed.org/graph/fredgraph.csv';" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-tab)    sed -i 's#href: `${own.href}${dash.tab}/${dash.slug}/`#href: own.href#' sites/cloudy-webapps/src/lib/server/nav.ts ;;
            finterm-placeholder) sed -i 's#data-testid="finterm-note">{note}</span>#data-testid="finterm-note"></span>#' packages/cloudy-ui/src/finterm/components/FinKeyRow.svelte ;;
            finterm-beat)        sed -i "s/return (a > f) === (better === 'higher') ? 'up' : 'down';/return (a > f) ? 'up' : 'down';/" packages/cloudy-ui/src/finterm/fin.ts ;;
            finterm-sign)        sed -i "s/  if (Number(t) === 0) return t + suffix;//" packages/cloudy-ui/src/finterm/fin.ts ;;
            finterm-cadence)     sed -i "s/  \[\/^(coinbase|kraken)\$\/, 15_000, MIN\],//" packages/cloudy-ui/src/finterm/fin.ts ;;
            finterm-sort)        sed -i "s/if (x !== null \&\& y !== null \&\& dir === 'desc') c = -c;//" packages/cloudy-ui/src/finterm/fin.ts ;;
            finterm-trim)        sed -i "s/if (Array.isArray(d\[k\])) d\[k\] = d\[k\].slice(-keep);/if (Array.isArray(d[k])) d[k] = d[k];/" packages/cloudy-ui/src/finterm/fin.ts ;;
            finterm-fred)   sed -i "s/\[\['id', id\], \['cosd'/[['series', id], ['cosd'/" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-model-merge) sed -i "s/      if (!f.merge) break;/      break;/" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-v1-first)    sed -i "s/  if (api \&\& f.primary?.api) {/  if (false \&\& api \&\& f.primary?.api) {/" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-window)      sed -i "s/e.ts.slice(0, 10) >= from \&\& e.ts.slice(0, 10) <= to \&\& //" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-cors-model)  sed -i "s/    if (browserReadable(source)) routes.push(\[source, f as Fetch \& Route\]);/    routes.push([source, f as Fetch \& Route]);/" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-alert-side)  sed -i "s/(r.kind === 'above' ? p.value > r.level : p.value < r.level)/(r.kind === 'above' ? p.value < r.level : p.value > r.level)/" packages/cloudy-ui/src/finterm/engine.ts ;;
            finterm-declared)    sed -i "s/      const doc = FINTERM.declared?.\[url.slice(6)\];/      const doc = undefined;/" packages/cloudy-ui/src/finterm/Dashboard.svelte ;;
            dropdown-cap)   sed -i 's/  return Math.min(whole, Math.max(Math.min(t.dropdownMinHeight, whole), below));/  return 520;/' packages/cloudy-ui/src/shell/navDropdown.ts ;;
            dropdown-css)   sed -i '/max-height: max(var(--nav-dropdown-min-height), calc(100dvh - calc(var(--fleet-top1-height) + 4px)/d' packages/cloudy-ui/src/fleet/FleetFirstRow.svelte ;;
            scroll-gesture) sed -i '/if (dy < 0 \&\& m.latch !== null \&\& m.latch === g) return m;/d' packages/cloudy-ui/src/shell/navUi.ts ;;
            dead-export)    sed -i "s/export { planIsland } from/export { planIsland, fullSizeCell } from/" packages/cloudy-ui/src/index.ts ;;
            dead-module)    printf '<p>orphan</p>\n' > packages/cloudy-ui/src/components/Orphan.svelte ;;
            island-width)   echo "MUTATION=island-width" >> "$GITHUB_ENV" ;;
            finterm-coverage)    sed -i 's/(coverage(values) + 1e-12 < min ? null : weighted(values))/(weighted(values))/' packages/cloudy-ui/src/finterm/tables.ts ;;
            finterm-shortname)   sed -i 's/return m ? `\${m\[2\].trim()} \${short}`.trim() : short;/return label;/' packages/cloudy-ui/src/finterm/tables.ts ;;
            finterm-curve)       sed -i 's/if (v === null || y === null) continue; pts.push({ key: k, label: k, x: y,/if (true) continue; pts.push({ key: k, label: k, x: y,/' packages/cloudy-ui/src/finterm/engine.ts ;;
            navui-rows)          sed -i "s/declaredList('CLEAN_DRAWER_ROWS', 'DrawerRow')/declaredList('CLEAN_DRAWER_ROWS_WITH_ACTIONS', 'DrawerRow')/" scripts/gen-tokens.mjs && node scripts/gen-tokens.mjs ;;
            finterm-table-blocked) sed -i 's/if (tried.length \&\& tried.every((x) => x.blocked)) throw/if (false) throw/' packages/cloudy-ui/src/finterm/tables.ts ;;
            fxm-rppp)       sed -i 's|(sHist \* (home1 / home0)) / (us1 / us0)|sHist * (home1 / home0)|' packages/cloudy-ui/src/finterm/fxmatrix.ts ;;
            fxm-dxy)        sed -i 's|acc \* Math.pow(x, w)|acc * Math.pow(x, -w)|' packages/cloudy-ui/src/finterm/fxmatrix.ts ;;
            fxm-diff)       sed -i 's|(today / x - 1) \* 100|(x / today - 1) * 100|' packages/cloudy-ui/src/finterm/fxmatrix.ts ;;
            fxm-cors)       sed -i 's|if (!browserReadable(s)) { fails.push|if (false) { fails.push|' packages/cloudy-ui/src/finterm/tables.ts ;;
            g20-ma)         sed -i "s|/ d.length, 'daily'\]|/ (d.length + 1), 'daily']|" packages/cloudy-ui/src/finterm/g20bonds.ts ;;
            g20-ann)        sed -i 's|Math.pow(today / past, 1 / years)|Math.pow(today / past, 1)|' packages/cloudy-ui/src/finterm/g20bonds.ts ;;
            g20-net)        sed -i 's|=> y - fx;|=> y + fx;|' packages/cloudy-ui/src/finterm/g20bonds.ts ;;
            g20-real)       sed -i 's|=> n - cpi;|=> n;|' packages/cloudy-ui/src/finterm/g20bonds.ts ;;
            *) echo "unknown mutation"; exit 2 ;;
          esac
          git diff --stat
      - name: Unit
        run: npm run sync --workspaces --if-present && npx vitest run
      - name: Build + route check
        run: npm run build && node scripts/test-routes.mjs && node scripts/test-old-urls.mjs
      - name: E2E (visual)
        run: npx playwright install --with-deps chromium && npx playwright test -c tests/playwright.config.ts
      - name: Web vs Android baseline (blocking)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BLOCKING: '1'
        run: node scripts/compare-baseline.mjs
