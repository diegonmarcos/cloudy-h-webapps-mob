# cloudy-h-webapps-mob CI (#1320). Builds run here only (owner rule: no local npm/Gradle).
#  legacy : scripts/test.sh (service fallback pages, shared nav, redirects) + vendored-data drift
#  unit   : Vitest (packages/*, scripts/*)
#  build  : both SvelteKit sites (adapter-static) -> sites/<site>/dist, budgets
#  e2e    : Playwright phone 412x915 + tablet 1280x800 / 800x1280 against the dists laid out as Pages serves them
#  dist   : dist is committed code (rule 12). On a push to main the fresh dists (and the lockfile) are committed
#           back when they differ, then the Pages mirror is bumped.
# Also runs daily and on repository_dispatch superapp-updated, so an Android-side change fails here even when
# this repo does not move (gen-tokens / gen-navdata / gen-icons --check).
name: test
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '29 5 * * *'
  repository_dispatch:
    types: [superapp-updated]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04  # Playwright 1.56.1 (same pin as the Pages repo) does not support 26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Legacy guards (service pages, shared nav, redirects)
        run: bash scripts/test.sh
      - name: Vendored service data == cloud-u-containers
        run: node scripts/sync-fallback-services.mjs --check
      - name: Drift - tokens, nav data, icon sprites, FinTerm sources and dashboards == cloudy-u-android main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/gen-tokens.mjs --check
          node scripts/gen-navdata.mjs --check
          node scripts/gen-icons.mjs --check
          node scripts/gen-app-links.mjs --check
          node scripts/gen-phone-apps.mjs --check
          node scripts/gen-finterm.mjs --check
      - name: Portal probe (declared embeddable == what each vendor site allows)
        run: node scripts/probe-portals.mjs
      - name: Install (npm ci when the lockfile exists)
        run: |
          # npm ci when the lockfile matches package.json; a dependency change refreshes the lockfile (committed back on main)
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - name: Unit (Vitest)
        run: npm run sync --workspaces --if-present && npx vitest run
      - name: Build both sites
        run: npm run build
      - name: Every routes.json path prerendered (trailing slash)
        run: node scripts/test-routes.mjs
      - name: Every old URL lands on a served page (redirect map + stubs)
        run: node scripts/test-old-urls.mjs
      - name: No credential shapes in the published dists
        run: sh scripts/scan-dists.sh
      - name: Budgets
        run: node scripts/budget.mjs
      - name: Playwright + Chromium
        run: npx playwright install --with-deps chromium
      - name: Write missing visual baselines (committed back on main; never overwrites one)
        run: npx playwright test -c tests/playwright.config.ts tests/e2e/visual.spec.ts --update-snapshots=missing || true
      - name: E2E phone + tablet
        run: npx playwright test -c tests/playwright.config.ts
      - name: Web vs Android baseline (Cloud-UI-Baseline.zip, pixelmatch; island, tabs, kit and fleet bars block at 5%)
        env:
          GH_TOKEN: ${{ github.token }}
          BASELINE_BLOCKING: '1'
        run: node scripts/compare-baseline.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            tests/results/shots
            tests/results/report
            tests/results/baseline
            tests/results/baseline-web
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit fresh dists back (push to main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # only the run of the newest source commit publishes: an older run whose dists would conflict steps aside
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then echo "main moved past ${GITHUB_SHA::9}: the newer run commits the dists"; exit 0; fi
          git add sites/cloudy-webapps/dist sites/cloudy-c3/dist package-lock.json tests/visual/__screenshots__
          if git diff --cached --quiet; then echo "dists current"; exit 0; fi
          git diff --cached --stat | tail -3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "auto: rebuild dists from ${GITHUB_SHA::9} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
          gh workflow run bump-pages.yml
